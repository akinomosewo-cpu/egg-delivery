<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>COSNG</title>
  </head>
  <body>
    <!-- Persistent translucent wallpaper — sits behind every screen, all the time -->
    <div style="
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #FAFAF8 url('/splash-full.png') repeat;
      background-size: 140px 140px;
      opacity: 0.07;
    "></div>

    <div id="root" style="position: relative; z-index: 1;"></div>

    <!-- One-time boot splash — shown briefly while the app loads, then fades out.
         pointer-events: none from the start, so even if removal is delayed or
         fails on a given browser engine, it can never block taps underneath it. -->
    <div id="boot-splash" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: #A3CC52 url('/splash-full.png') center center / cover no-repeat;
      display: flex;
    "></div>
    <script>
      (function () {
        var removed = false;
        function remove() {
          if (removed) return;
          var el = document.getElementById('boot-splash');
          if (el) {
            el.style.transition = 'opacity 0.25s ease';
            el.style.opacity = '0';
            setTimeout(function () { el.remove(); }, 250);
          }
          removed = true;
        }
        // Primary signal: main.jsx calls this explicitly the moment the
        // app has actually painted — reliable across browser engines,
        // unlike inferring readiness from DOM mutations.
        window.__appBooted = remove;

        // Fallback in case the explicit signal never arrives for some reason
        var root = document.getElementById('root');
        if (root) {
          var observer = new MutationObserver(function () {
            if (root.childNodes.length > 0) {
              remove();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true });
        }
        setTimeout(remove, 4000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
